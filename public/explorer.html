<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="shared.css"><title>Language Explorer · NFA→DFA Studio</title></head><body><main>
<h1>Language Explorer</h1><p class="sub">Analyse the language of an automaton, or prove two automata equivalent. Machine B can be an NFA or DFA.</p>
<div class="grid"><div class="card"><h2>Automaton A</h2><textarea id="a" spellcheck="false"></textarea><div class="row"><button id="pa">Analyse A</button></div><div id="oa" style="margin-top:8px"></div></div>
<div class="card"><h2>Automaton B</h2><textarea id="b" spellcheck="false"></textarea><div class="row"><button id="pb">Analyse B</button></div><div id="ob" style="margin-top:8px"></div></div></div>
<div class="card"><div class="row" style="margin:0"><button id="eq">Is L(A) = L(B)?</button></div><div id="oe" style="margin-top:8px"></div></div>
</main><script src="nav.js"></script><script src="automata.js"></script><script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("a").value="start: q0\nfinal: q2\nq0,a = q0,q1\nq0,b = q0\nq1,b = q2";
$("b").value="start: A\nfinal: C\nA,a = B\nA,b = A\nB,a = B\nB,b = C\nC,a = B\nC,b = A";
function an(id,out){try{const N=Automata.parse($(id).value),p=Automata.properties(N),y=v=>'<span class="pill '+(v?"y":"n")+'">'+(v?"yes":"no")+"</span>";
$(out).innerHTML=N.warn.map(w=>'<div class="small">⚠ '+E(w)+"</div>").join("")+"<table><tr><td>Language empty?</td><td>"+y(p.empty)+"</td></tr><tr><td>Accepts every string (Σ*)?</td><td>"+y(p.universal)+"</td></tr><tr><td>Finite language?</td><td>"+y(p.finite)+"</td></tr><tr><td>DFA / minimal DFA states</td><td>"+p.dfaStates+" / "+p.minimal+"</td></tr><tr><td>Shortest accepted</td><td>"+(p.words[0]!==undefined?E(p.words[0]):"none")+"</td></tr><tr><td>First accepted strings</td><td style='white-space:normal'>"+(p.words.map(E).join(", ")||"none")+"</td></tr></table>"}catch(e){$(out).innerHTML='<div class="err">'+E(e.message)+"</div>"}}
$("pa").onclick=()=>an("a","oa");$("pb").onclick=()=>an("b","ob");
$("eq").onclick=()=>{try{const A=Automata.parse($("a").value),B=Automata.parse($("b").value),r=Automata.equivalent(A,B);
$("oe").innerHTML=r.ok?'<span class="pill y">✓ Equivalent</span> A and B accept exactly the same language (checked over every reachable pair of subsets).':'<span class="pill n">✗ Different</span> Shortest distinguishing string: <b>“'+E(r.counter.join(A.alpha.every(x=>x.length===1)?"":" ")||"ε")+"”</b> is "+(r.nfaAccepts?"accepted by A only":"accepted by B only")+"."}catch(e){$("oe").innerHTML='<div class="err">'+E(e.message)+"</div>"}};
an("a","oa");an("b","ob");
</script></body></html>
